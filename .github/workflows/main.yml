name: Build CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: VenderMachine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Vendora.sln

      - name: Build Solution
        run: dotnet build Vendora.sln --no-restore --configuration Release

      - name: No Tests Available
        run: echo "No test project exists yet. Skipping test stage."
